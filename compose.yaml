name: corpora

services:

  corpora:
    image: bptarpley/corpora
    container_name: corpora
    hostname: corpora
    networks:
      corpora:
    restart: unless-stopped
    environment:
      CRP_HOSTS: corpora.library.tamu.edu
      CRP_DJANGO_WORKERS: 3
      CRP_HUEY_WORKERS: 10
      CRP_MONGO_POOLSIZE: 5
      CRP_USE_SSL: "yes"
      CRP_INSTALLED_PLUGINS: "nvs"
      CRP_ELASTIC_HOST: http://elastic:9200
      CRP_ELASTIC_SYNONYM_OPTIONS: early_modern:Early Modern:early_modern_synonyms.txt
      CRP_MONGO_HOST: mongo
      CRP_MONGO_DB: corpora
      CRP_MONGO_USER: corpora
      CRP_MONGO_PWD: corpora
      CRP_NEO4J_HOST: neo4j
      CRP_NEO4J_PWD: corporaNEO4Jpwd
    ports:
      - 8000:8000
      - 9999:9999
    volumes:
      - ./corpora-pv/git/app:/apps/corpora
      - ./corpora-pv/git/app/imagemagick.xml:/etc/ImageMagick-6/policy.xml
      - ./corpora-pv/static:/static
      - ./corpora-pv/corpora:/corpora
      - ./corpora-pv/import:/import
      - ./corpora-pv/conf:/conf
      - ./corpora-pv/plugins/nvs:/apps/corpora/plugins/nvs
    depends_on:
      - mongo
      - neo4j
      - elastic
      - redis
    entrypoint:
      - sh
      - -c
      - |
        /apps/corpora/start.sh

  elastic:
    image: elasticsearch:8.12.2
    container_name: elastic
    hostname: elastic
    networks:
      corpora:
    restart: unless-stopped
    environment:
      discovery.type: single-node
      indices.id_field_data.enabled: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms8g -Xmx15g"
    ports:
      - 9200:9200
    volumes:
      - ./corpora-pv/git/elasticsearch/early_modern_synonyms.txt:/usr/share/elasticsearch/config/early_modern_synonyms.txt
      - ./elastic-pv:/usr/share/elasticsearch/data
    mem_reservation: 8192m
    mem_limit: 16384m

  iiif:
    image: bptarpley/iiif
    container_name: iiif
    hostname: iiif
    networks:
      corpora:
    restart: unless-stopped
    ports:
      - 8182:8182
    volumes:
      - ./corpora-pv/corpora:/var/iiif/imageroot/corpora
      - ./corpora-pv/iiif/cantaloupe.properties:/etc/cantaloupe.properties
      - ./iiif-pv/cache:/var/iiif/cache
      - ./iiif-pv/temp:/var/iiif/temp

  mongo:
    image: mongo:7.0.4
    container_name: mongo
    hostname: mongo
    networks:
      corpora:
    restart: unless-stoppped
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: corpora
      MONGO_INITDB_ROOT_PASSWORD: corpora
    volumes:
      - ./mongo-pv:/data/db

  neo4j:
    image: neo4j:5.7.0-community
    contaienr_name: neo4j
    hostname: neo4j
    networks:
      corpora:
    restart: unless-stopped
    ports:
      - 7687:7687
      - 7474:7474
    environment:
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_config_strict__validation_enabled: false
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_AUTH: neo4j/corporaNEO4Jpwd
    volumes:
      - ./neo4j-pv:/data
    mem_reservation: 2048m
    mem_limit: 5632m

  redis:
    image: redis:7.0.14
    container_name: redis
    hostname: redis
    networks:
      corpora:
    restart: unless-stopped
    ports:
      - 6379:6379

  nginx:
    image: nginx
    container_name: nginx
    hostname: nginx
    networks:
      corpora:
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./corpora-pv/git/nginx/corpora.conf:/etc/nginx/conf.d/default.conf
      - ./corpora-pv/static:/data/corpora/static
      - ./corpora-pv/corpora:/data/corpora/corpora
      - ./corpora-pv/proprietary:/data/corpora/static/proprietary

  mgmt:
    image: ubuntu
    container_name: mgmt
    hostname: mgmt
    networks:
      corpora:
    restart: unless-stopped
    volumes:
      - ./corpora-pv:/opt/corpora
      - ./neo4j-pv:/opt/neo4j
      - ./mongo-pv:/opt/mongo
      - ./elastic-pv:/opt/elastic
      - ./iiif-pv:/opt/iiif
    entrypoint:
      - sh
      - -c
      - |
        apt-get update -y
        apt-get install nano git -y
        tail -f /dev/null
        # Use the following command to clone the nvs repo as needed in the container shell:
        # git clone https://github.com/newvariorumshakespeare/corpora-plugin.git /opt/corpora/plugins/nvs

networks:
  corpora:
